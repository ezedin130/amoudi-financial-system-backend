server:
  port: ${PORT:${SERVER_PORT:8080}}
  address: 0.0.0.0
  shutdown: graceful

spring:
  application:
    name: amoudi-financial

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:20}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      idle-timeout: 30000
      connection-timeout: 20000
      pool-name: AmoudiProdHikariCP

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 50
          order_inserts: true
          order_updates: true
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
    clean-disabled: true

  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 30MB

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  storage:
    local:
      upload-dir: ${STORAGE_PATH:/app/storage/uploads}
  security:
    initial-user:
      enabled: ${INITIAL_USER_ENABLED:false}
      username: ${INITIAL_USER_USERNAME:admin}
      password: ${INITIAL_USER_PASSWORD:}
      full-name: ${INITIAL_USER_FULL_NAME:System Administrator}
      role: ${INITIAL_USER_ROLE:GENERAL_MANAGER}

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [CID:%X{correlationId:-none}] %logger{36} - %msg%n"
  level:
    root: INFO
    com.amoudi.financial: INFO
    org.flywaydb: INFO
    org.springframework.web: WARN
    org.springframework.security: WARN
