server:
  port: ${PORT:${SERVER_PORT:8080}}
  address: ${SERVER_ADDRESS:0.0.0.0}
  shutdown: graceful

spring:
  application:
    name: amoudi-financial
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:amoudi_financial}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 20000
      pool-name: AmoudiHikariCP

  jpa:
    open-in-view: false
    hibernate:
      # Mandatory: Hibernate does NOT create or alter tables. Flyway owns schema evolution.
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 25
          order_inserts: true
          order_updates: true
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
    clean-disabled: true

  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 30MB

app:
  storage:
    local:
      upload-dir: ${STORAGE_PATH:./storage/uploads}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  jwt:
    # 256-bit+ HMAC-SHA secret key. In production, load from JWT_SECRET environment variable.
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 hours (86,400,000 ms)
  security:
    initial-user:
      enabled: ${INITIAL_USER_ENABLED:true}
      username: ${INITIAL_USER_USERNAME:admin}
      password: ${INITIAL_USER_PASSWORD:Admin@12345}
      full-name: ${INITIAL_USER_FULL_NAME:System Administrator}
      role: ${INITIAL_USER_ROLE:GENERAL_MANAGER}

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [CID:%X{correlationId:-none}] %logger{36} - %msg%n"
  level:
    root: INFO
    com.amoudi.financial: INFO
    org.flywaydb: INFO
    org.springframework.web: INFO
    org.springframework.security: INFO
